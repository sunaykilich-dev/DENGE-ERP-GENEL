[project]
name = "denge-erp"
version = "0.1.0"
description = "Denge Mobilite ERP — cihaz, hat, is emri, hak edis ve satis yonetimi"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "phonenumbers>=8.13",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "cryptography>=43.0",
    "pyotp>=2.9",
    "qrcode>=8.0",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    # Europe/Istanbul saat dilimi verisi (teknik servis yerel gun, TS-011).
    # Windows ve ince Docker imajlarinda sistem zoneinfo veritabani yok.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: gercek PostgreSQL gerektirir (TEST_DATABASE_URL)",
    "yetki_matrisi: tum korumali uclari rol x uc olarak tarayan yavas test (TS-013)",
    "kapsam_taramasi: {id} yollu teknik servis uclarinda kapsam disi 404 taramasi (TS-013)",
    "slow: buyuk veriyle performans olcumu (ornegin takvim/liste < 1 sn); -m 'not slow' ile atlanir",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic'in autogenerate ettigi dosyalar bicimlendirilmez — uretilmis kod.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# S = bandit. Asil amac S608: string birlestirmeyle kurulan SQL. Kod bugun
# temiz; kural gelecekteki bir "sadece su alani f-string'le ekleyeyim"i
# incelemeye zorlasin diye acik.
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert (S101) ve sabit parola (S105/S106) kuralin konusu degil.
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "S324", "S603", "S607"]
# Gocler semadan okunan tablo/kolon adlariyla DDL/DML kuruyor; bu adlar
# kullanici girdisi degil, pg_constraint'ten geliyor (bkz. hesap_birlestir).
"app/migration/hesap_birlestir.py" = ["S608"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
