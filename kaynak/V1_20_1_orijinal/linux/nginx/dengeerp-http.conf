# SADECE SIRKET ICI PILOT, TLS YOK! Internet'e YONLENDIRMEYIN.
# HTTPS hazirlandiginda dengeerp-https.conf ile degistirin.
server {
    listen 10.10.50.16:5050;
    server_name 10.10.50.16;
    access_log /var/log/nginx/dengeerp_access.log;
    error_log /var/log/nginx/dengeerp_error.log warn;
    client_max_body_size 20m;
    server_tokens off;
    allow 10.10.50.0/24;
    allow 127.0.0.1;
    deny all;
    location / {
        proxy_pass http://127.0.0.1:5051;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
