# /etc/fail2ban/filter.d/denge-erp.conf
# Caddy JSON erisim logunda /api/auth/login'e 401/423 donen istekleri yakalar.
# Caddy'yi JSON log formatiyla calistirin (bkz. deploy/Caddyfile).
# Alan adlari Caddy surumune gore degisebilir; kendi logunuzla dogrulayin:
#   fail2ban-regex /var/log/caddy/access.log /etc/fail2ban/filter.d/denge-erp.conf

[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"uri":"/api/auth/login.*".*"status":(401|423).*$
ignoreregex =
