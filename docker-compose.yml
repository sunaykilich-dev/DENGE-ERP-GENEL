services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dengeerp
      POSTGRES_USER: dengeerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimli olmali}
    ports:
      # Yerelde host'tan (make api, testler, psql) erisilsin diye acik.
      # Sunucuda bu satir kaldirilir; yalnizca compose agi icinden erisilir.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dengeerp -d dengeerp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Izin katalogu (app/permissions.py) senkronu ACILISTA kosar: yeni bir izin
    # eklendiginde migration degil seed degisir, ve senkron atlanirsa yetki
    # sessizce kimsede gorunmez -- KVKK ekrani tam boyle kayboldu.
    # Gercek istemci IP'si (TS-211): Caddy host'ta, API konteynerde. Konteynerin
    # gordugu kaynak Docker ag gecidi (172.x) oldugu icin uvicorn varsayilanda
    # (yalniz 127.0.0.1'e guvenir) X-Forwarded-For'u yok sayiyor ve denetim
    # kaydina her giris icin ag gecidi IP'si yaziliyordu. FORWARDED_ALLOW_IPS
    # .env'de Docker ag gecidi olmali (ornek: 172.18.0.1); bos ise 127.0.0.1.
    # `$$` compose'un degil konteyner kabugunun degiskeni acmasi icindir.
    command: >
      sh -c "alembic upgrade head
      && python -m app.seeds.dev
      && uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips \"$${FORWARDED_ALLOW_IPS:-127.0.0.1}\""
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dengeerp:${POSTGRES_PASSWORD}@db:5432/dengeerp
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - files:/app/var/files
    depends_on:
      db:
        condition: service_healthy

  # DIKKAT: worker KESINLIKLE tek replika calismali.
  # Ay sonu hak edis kapanisi, operator senkronu ve abonelik yenileme
  # "tam olarak bir kosucu sureci" varsayimina dayanir; iki kopya calisirsa
  # ayni donem iki kez kapanabilir.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dengeerp:${POSTGRES_PASSWORD}@db:5432/dengeerp
    volumes:
      - files:/app/var/files
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 1

volumes:
  pgdata:
  files:
